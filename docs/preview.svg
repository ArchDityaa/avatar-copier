<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Avatar Copier interface preview</title>
  <desc id="desc">A dark draggable window with a target input, Copy avatar and Reset buttons, and a green success status card.</desc>

  <defs>
    <radialGradient id="pageGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d1b2f"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.60"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="200" y="104" width="320" height="272" rx="12"/>
    </clipPath>
  </defs>

  <rect width="720" height="480" fill="url(#pageGlow)"/>
  <ellipse cx="360" cy="240" rx="280" ry="210" fill="url(#accentGlow)"/>

  <g filter="url(#windowShadow)">
    <rect x="200" y="104" width="320" height="272" rx="12" fill="#18181b" stroke="#3f3f46"/>
  </g>

  <g clip-path="url(#windowClip)">
    <rect x="200" y="104" width="320" height="44" fill="#232329"/>
  </g>
  <line x1="200" y1="148" x2="520" y2="148" stroke="#2f2f37"/>

  <!-- Header -->
  <rect x="214" y="113" width="26" height="26" rx="8" fill="#6366f1"/>
  <text x="227" y="131" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">A</text>

  <text x="250" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">Avatar Copier</text>

  <rect x="416" y="116" width="54" height="20" rx="6" fill="#2a2a32"/>
  <text x="443" y="130" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a1a1aa">v1.2.0</text>

  <rect x="478" y="110" width="32" height="32" rx="9" fill="#2a2a32"/>
  <text x="494" y="132" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a1a1aa">×</text>

  <!-- Target input -->
  <text x="214" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6" fill="#a1a1aa">TARGET PLAYER</text>

  <rect x="214" y="178" width="292" height="40" rx="10" fill="#232329" stroke="#3f3f46"/>
  <circle cx="228" cy="198" r="4.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="231.5" y1="201.5" x2="235" y2="205" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round"/>
  <text x="242" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4f4f5">Roblox</text>
  <text x="214" y="232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a1a1aa">Username, user ID, or profile URL</text>

  <!-- Actions -->
  <rect x="214" y="242" width="196" height="40" rx="9" fill="#6366f1"/>
  <text x="312" y="267" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Copy avatar</text>

  <rect x="418" y="242" width="88" height="40" rx="9" fill="#232329" stroke="#3f3f46"/>
  <text x="462" y="267" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Reset</text>

  <!-- Status card -->
  <rect x="214" y="294" width="292" height="48" rx="10" fill="#1a3025" stroke="#2c4a38"/>
  <circle cx="227" cy="318" r="3" fill="#4ade80"/>
  <text x="236" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4ade80">Copied from Roblox (local only)</text>

  <!-- Footer -->
  <text x="214" y="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#a1a1aa" opacity="0.8">Client-side only — other players can't see it.</text>
</svg>
